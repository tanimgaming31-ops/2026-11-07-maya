name: MYRAA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - MYRAA_Theme_Studio_Source_Tanim_Boss.zip
      - .github/workflows/myraa-android-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MYRAA Android test APK
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and verify MYRAA source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'MYRAA_Theme_Studio_Source_Tanim_Boss.zip'
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "The MYRAA source ZIP is missing. Upload $zip to the repository root from your Android phone."
          }
          $expected = '5f22942e2bac118be376c3bed97ccbc5de485ea92d2acc7b5aef444163d9107d'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source ZIP checksum differs from the verified package. Expected $expected. Got $actual." }
          Expand-Archive -LiteralPath $zip -DestinationPath . -Force
          foreach ($file in @('package.json', 'package-lock.json', 'scripts/build-android.ps1', 'android/app/src/main/AndroidManifest.xml')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required source: $file" }
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate preinstalled Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, 'C:\Android\android-sdk') | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $sdk = $roots | Select-Object -First 1
          if (-not $sdk) { throw 'No Android SDK was found on the Windows runner.' }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Using Android SDK at $sdk"

      - name: Install Android SDK 35 tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Get-ChildItem -Path (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Filter sdkmanager.bat -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cmd) { throw 'sdkmanager.bat was not found in Android command-line tools.' }
          & $cmd.FullName --sdk_root="$env:ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK 35 setup failed' }

      - name: Install MYRAA JavaScript dependencies
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Build and sign Android APK
        shell: pwsh
        run: |
          & ./scripts/build-android.ps1 -SdkRoot $env:ANDROID_HOME -JavaRoot $env:JAVA_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Android build failed' }

      - name: Validate APK
        shell: pwsh
        run: |
          $apk = 'artifacts/android/MYRAA-Mobile-1.0.0-rc.5-private.apk'
          if (-not (Test-Path -LiteralPath $apk)) { throw 'No output APK found' }
          $tool = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0/apksigner.bat'
          & $tool verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature check failed' }
          Get-FileHash -LiteralPath $apk -Algorithm SHA256 | Format-List

      - name: Upload MYRAA Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-Android-APK
          path: artifacts/android/MYRAA-Mobile-1.0.0-rc.5-private.apk
          retention-days: 7
          if-no-files-found: error
