name: MYRAA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - MYRAA_Theme_Studio_Source_Tanim_Boss.zip
      - .github/workflows/myraa-android-apk.yml
      - pink-home.js
      - pink-home.css
      - maya-vrm-engine.js
      - mobile-safe-header.css

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MYRAA Android test APK
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and verify MYRAA source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'MYRAA_Theme_Studio_Source_Tanim_Boss.zip'
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "The MYRAA source ZIP is missing. Upload $zip to the repository root from your Android phone."
          }
          $expected = '5f22942e2bac118be376c3bed97ccbc5de485ea92d2acc7b5aef444163d9107d'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source ZIP checksum differs from the verified package. Expected $expected. Got $actual." }
          Expand-Archive -LiteralPath $zip -DestinationPath . -Force
          foreach ($file in @('package.json', 'package-lock.json', 'scripts/build-android.ps1', 'android/app/src/main/AndroidManifest.xml')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required source: $file" }
          }


      - name: Install pink character home UI into Android source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'index.html')) { throw 'Vite index.html was not found inside the verified source ZIP.' }
          New-Item -ItemType Directory -Force -Path 'public' | Out-Null
          Copy-Item -LiteralPath 'pink-home.js' -Destination 'public/pink-home.js' -Force
          Copy-Item -LiteralPath 'pink-home.css' -Destination 'public/pink-home.css' -Force
          Copy-Item -LiteralPath 'mobile-safe-header.css' -Destination 'public/mobile-safe-header.css' -Force
          & node --check 'public/pink-home.js'
          if ($LASTEXITCODE -ne 0) { throw 'Pink UI JavaScript syntax failed' }
          $preview = Get-Content -LiteralPath 'theme-studio.html' -Raw -Encoding utf8
          $imageMatch = [regex]::Match($preview, '"rose-character\.jpg":"data:image/jpeg;base64,([^"]+)"')
          if (-not $imageMatch.Success) { throw 'Licensed original rose character concept image missing from preview; cannot use another artist asset.' }
          [byte[]] $bytes = [Convert]::FromBase64String($imageMatch.Groups[1].Value)
          Add-Type -AssemblyName System.Drawing
          $memory = [System.IO.MemoryStream]::new($bytes)
          $image = [System.Drawing.Image]::FromStream($memory)
          $rectangle = [System.Drawing.Rectangle]::new([int]($image.Width * 0.30), [int]($image.Height * 0.09), [int]($image.Width * 0.40), [int]($image.Height * 0.70))
          $bitmap = [System.Drawing.Bitmap]::new($rectangle.Width, $rectangle.Height)
          $canvas = [System.Drawing.Graphics]::FromImage($bitmap)
          $canvas.DrawImage($image, [System.Drawing.Rectangle]::new(0,0,$bitmap.Width,$bitmap.Height), $rectangle, [System.Drawing.GraphicsUnit]::Pixel)
          $bitmap.Save((Join-Path (Resolve-Path 'public').Path 'pink-character.jpg'), [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $canvas.Dispose(); $bitmap.Dispose(); $image.Dispose(); $memory.Dispose()
          $html = Get-Content -LiteralPath 'index.html' -Raw -Encoding utf8
          if ($html -notmatch 'pink-home\.js') {
            if ($html -notmatch '(?i)</head>' -or $html -notmatch '(?i)</body>') { throw 'Unexpected index.html structure.' }
            $html = [regex]::Replace($html, '(?i)</head>', '  <link rel="stylesheet" href="./pink-home.css" />' + [Environment]::NewLine + '</head>', 1)
            $html = [regex]::Replace($html, '(?i)</body>', '  <script defer src="./pink-home.js"></script>' + [Environment]::NewLine + '</body>', 1)
            Set-Content -LiteralPath 'index.html' -Value $html -Encoding utf8
          }
          if (-not (Test-Path 'public/pink-character.jpg')) { throw 'Pink character art generation failed' }
          Write-Output 'Pink mobile home interface installed; native code, data storage and service files unchanged.'


      - name: Restore old verified real VRM 3D avatar and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $origin = 'https://raw.githubusercontent.com/tanimgaming31-ops/Maya-2026-10-19/220f5444cae89c12d4fb493ead3463a3ba6d4cc3'
          $expected = @{
            'maya.vrm' = 'bbc9a106729ab343fe5202ba502873172cc80e498b949833c63d44454ad7d85d'
            'vendor/three/three.module.min.js' = 'e2b5ee6bccd38fd6d8a2428546b83c5f2426d84b152ef82be8055556e3b40eb6'
            'vendor/three/three.core.min.js' = '61ba0df005b05991361d040d8ff670e1aadfd0ce7aeebd1fdb0725957a8957de'
            'vendor/three/addons/utils/BufferGeometryUtils.js' = 'fda7e946b8e0b5ab39b779206589e7a1079a22eb24efb89d7223e03fdfb1f751'
            'vendor/three/addons/loaders/GLTFLoader.js' = '67ac5551fdafa6e349bd80c8f8e5e39c136d6b2fb1ad647db9abb21dc86f9e4a'
            'vendor/three-vrm.module.min.js' = '99f943e956e52dbf52bbe418899e8a8ae5e35f5c79a94ab8e404926afc620bf2'
          }
          foreach ($file in @($expected.Keys)) {
            $dest = Join-Path 'public' $file
            $folder = Split-Path -Parent $dest
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            $url = "$origin/$file"
            Write-Output "Retrieving backed-up 3D asset $file from pinned legacy commit"
            Invoke-WebRequest -Uri $url -OutFile $dest -MaximumRedirection 5
            $hash = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$file]) { throw "3D backup SHA256 mismatch for $file. Refusing to build." }
          }
          Copy-Item -LiteralPath 'maya-vrm-engine.js' -Destination 'public/maya-vrm-engine.js' -Force
          $html = Get-Content -LiteralPath 'index.html' -Raw -Encoding utf8
          if ($html -notmatch '(?i)</head>' -or $html -notmatch '(?i)</body>') {
            throw 'Unexpected app HTML structure: refusing to alter it.'
          }
          if ($html -notmatch 'type="importmap"') {
            $map = '<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/","@pixiv/three-vrm":"./vendor/three-vrm.module.min.js"}}</script>'
            $html = [regex]::Replace($html, '(?i)</head>', $map + [Environment]::NewLine + '</head>', 1)
          }
          if ($html -notmatch 'maya-vrm-engine.js') {
            $html = [regex]::Replace($html, '(?i)</body>', '<script type="module" src="./maya-vrm-engine.js"></script>' + [Environment]::NewLine + '</body>', 1)
          }
          Set-Content -LiteralPath 'index.html' -Value $html -Encoding utf8
          if ((Get-Item 'public/maya.vrm').Length -lt 13000000) { throw 'The real 3D VRM model is unexpectedly small.' }
          Write-Output 'Real 3D assets restored with SHA256 validation. Original source ZIP, Memory Packs and core application untouched.'


      - name: Fix actual Android entry screen mobile.html
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The APK launches assets/mobile.html, NOT the Vite demo index.html.
          # Earlier builds packaged JS and VRM but never loaded them: repair the actual app entry.
          $entry = 'mobile.html'
          if (-not (Test-Path -LiteralPath $entry)) { throw 'mobile.html is missing: cannot patch the Android entry safely' }
          $html = Get-Content -LiteralPath $entry -Raw -Encoding utf8
          if ($html -notmatch '(?i)<head' -or $html -notmatch '(?i)</body>') { throw 'Unexpected mobile.html document structure' }
          if ($html -notmatch 'mobile-safe-header.css') {
            $safeHeader = '<link rel="stylesheet" href="./mobile-safe-header.css" />'
            $html = [regex]::Replace($html, '(?i)</head>', $safeHeader + [Environment]::NewLine + '</head>', 1)
          }
          if ($html -notmatch 'maya-pink-mobile-bootstrap') {
            $map = '<script type="importmap" id="maya-vrm-importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/","@pixiv/three-vrm":"./vendor/three-vrm.module.min.js"}}</script>'
            $html = [regex]::Replace($html,'(?i)(<head[^>]*>)','$1' + [Environment]::NewLine + $map,1)
            $bootstrap = @'
          <script id="maya-pink-mobile-bootstrap">
          (function(){
            'use strict';
            function loadPinkAnd3D() {
              if (document.getElementById('maya-mobile-ui-loaded')) return;
              var style=document.createElement('link');
              style.id='maya-mobile-ui-loaded';style.rel='stylesheet';style.href='./pink-home.css';
              document.head.appendChild(style);
              var pink=document.createElement('script');
              pink.src='./pink-home.js';
              pink.onload=function(){
                var vrm=document.createElement('script');
                vrm.type='module';
                vrm.src='./maya-vrm-engine.js';
                vrm.addEventListener('error',function(){console.error('Maya 3D module failed to load; 2D fallback kept');});
                document.body.appendChild(vrm);
              };
              pink.onerror=function(){console.error('Pink UI failed to load from app assets');};
              document.body.appendChild(pink);
            }
            if(document.readyState==='loading')
              document.addEventListener('DOMContentLoaded',loadPinkAnd3D,{once:true});
            else loadPinkAnd3D();
          })();
          </script>
          '@
            $html = [regex]::Replace($html,'(?i)</body>', $bootstrap + [Environment]::NewLine + '</body>',1)
            Set-Content -LiteralPath $entry -Value $html -Encoding utf8
          }
          foreach($needle in @('maya-pink-mobile-bootstrap','maya-vrm-importmap','pink-home.js','maya-vrm-engine.js','mobile-safe-header.css')) {
            if ((Get-Content $entry -Raw -Encoding utf8) -notlike "*$needle*") { throw "Missing mobile UI startup token $needle" }
          }
          Write-Output 'Actual Android entry mobile.html now starts pink home and 3D renderer.'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm


      - name: Verify 3D VRM JavaScript module syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content -LiteralPath 'public/maya-vrm-engine.js' -Raw -Encoding utf8 | node --input-type=module --check
          if ($LASTEXITCODE -ne 0) { throw 'The 3D VRM engine did not pass JavaScript syntax validation.' }


      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate preinstalled Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, 'C:\Android\android-sdk') | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $sdk = $roots | Select-Object -First 1
          if (-not $sdk) { throw 'No Android SDK was found on the Windows runner.' }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Using Android SDK at $sdk"

      - name: Install Android SDK 35 tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Get-ChildItem -Path (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Filter sdkmanager.bat -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cmd) { throw 'sdkmanager.bat was not found in Android command-line tools.' }
          & $cmd.FullName --sdk_root="$env:ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK 35 setup failed' }

      - name: Install MYRAA JavaScript dependencies
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Build and sign Android APK
        shell: pwsh
        run: |
          & ./scripts/build-android.ps1 -SdkRoot $env:ANDROID_HOME -JavaRoot $env:JAVA_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Android build failed' }

      - name: Validate APK
        shell: pwsh
        run: |
          $apk = 'artifacts/android/MYRAA-Mobile-1.0.0-rc.5-private.apk'
          if (-not (Test-Path -LiteralPath $apk)) { throw 'No output APK found' }
          $tool = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0/apksigner.bat'
          & $tool verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature check failed' }
          Get-FileHash -LiteralPath $apk -Algorithm SHA256 | Format-List


      - name: Verify the real VRM assets are inside the signed APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = 'artifacts/android/MYRAA-Mobile-1.0.0-rc.5-private.apk'
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk).Path)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($required in @('/maya.vrm', '/maya-vrm-engine.js', '/vendor/three/three.module.min.js', '/vendor/three-vrm.module.min.js')) {
              $matches = @($entries | Where-Object { $_.EndsWith($required, [StringComparison]::OrdinalIgnoreCase) -or $_ -eq $required.TrimStart('/') })
              if ($matches.Count -eq 0) { throw "Signed APK is missing 3D file $required." }
              Write-Output "Verified inside APK: $($matches[0])"
            }
          }
          finally { $archive.Dispose() }


      - name: Verify Pink + 3D bootstraps inside signed Android entry HTML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          $apk = (Resolve-Path 'artifacts/android/MYRAA-Mobile-1.0.0-rc.5-private.apk').Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($apk)
          try {
            $entry = $archive.GetEntry('assets/mobile.html')
            if (-not $entry) { throw 'Signed APK does not have the real Android mobile.html entry.' }
            $stream = [System.IO.StreamReader]::new($entry.Open())
            try { $html = $stream.ReadToEnd() }
            finally { $stream.Dispose() }
            foreach ($token in @('maya-pink-mobile-bootstrap','maya-vrm-importmap','pink-home.js','pink-home.css','maya-vrm-engine.js')) {
              if (-not $html.Contains($token)) { throw "Signed APK has 3D assets, but real mobile.html does not invoke $token. Reject." }
              Write-Output "Confirmed signed APK mobile.html startup: $token"
            }
            $script = $archive.GetEntry('assets/pink-home.js')
            if (-not $script -or $script.Length -lt 1000) { throw 'Bundled pink UI script missing/empty.' }
            $runtime = $archive.GetEntry('assets/maya-vrm-engine.js')
            if (-not $runtime -or $runtime.Length -lt 3000) { throw 'Bundled 3D runtime missing/empty.' }
            # Vite folds source CSS links into the hashed CSS bundle referenced by real mobile.html.
            $loadedHeaderCss = $false
            foreach ($style in @($archive.Entries | Where-Object { $_.FullName -match '^assets/assets/.*\.css$' })) {
              if (-not $html.Contains((Split-Path $style.FullName -Leaf))) { continue }
              $reader3 = [System.IO.StreamReader]::new($style.Open())
              try { $compiledCss = $reader3.ReadToEnd() } finally { $reader3.Dispose() }
              if ($compiledCss.Contains('safe-area-inset-top') -and $compiledCss -match '#app\s*>\s*header') {
                $loadedHeaderCss = $true
                Write-Output "Found safe-area header styles in CSS loaded by Android entry: $($style.FullName)"
              }
            }
            if (-not $loadedHeaderCss -and -not $html.Contains('mobile-safe-header.css')) {
              throw 'The real mobile.html does not load the requested lower and larger header styles.'
            }
            $headCss = $archive.GetEntry('assets/mobile-safe-header.css')
            if (-not $headCss -or $headCss.Length -lt 1000) { throw 'Safe-area header CSS is missing from signed APK.' }
            $reader = [System.IO.StreamReader]::new($headCss.Open())
            try { $headerCssText = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if (-not $headerCssText.Contains('safe-area-inset-top') -or -not $headerCssText.Contains('#app > header')) {
              throw 'Signed APK header stylesheet does not contain the requested lower/larger header fix.'
            }
            $pinkJs = $archive.GetEntry('assets/pink-home.js')
            $reader2 = [System.IO.StreamReader]::new($pinkJs.Open())
            try { $pinkJsText = $reader2.ReadToEnd() } finally { $reader2.Dispose() }
            if (-not $pinkJsText.Contains('myraa.pink.home.enabled.v2')) {
              throw 'Pink UI defaults have not been reset for the fixed Android build.'
            }
            $model = $archive.GetEntry('assets/maya.vrm')
            if (-not $model -or $model.Length -lt 13000000) { throw '3D avatar missing from APK.' }
            Write-Output "Actual Android screen references UI and 3D. Model bytes: $($model.Length)."
          } finally { $archive.Dispose() }

      - name: Upload MYRAA Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-Android-APK
          path: artifacts/android/MYRAA-Mobile-1.0.0-rc.5-private.apk
          retention-days: 7
          if-no-files-found: error
