name: MYRAA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - MYRAA_GitHub_Android_Build_Ready_Tanim_Boss.zip
      - .github/workflows/myraa-android-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MYRAA Android test APK
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and verify MYRAA source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'MYRAA_GitHub_Android_Build_Ready_Tanim_Boss.zip'
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "The MYRAA source ZIP is missing. Upload $zip to the repository root from your Android phone."
          }
          $expected = '89caa6adc0ccb91a4871a12d1773c8340eaabbe9d02fc75be0a312a7dbd9d073'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source ZIP checksum differs from the verified package. Expected $expected. Got $actual." }
          Expand-Archive -LiteralPath $zip -DestinationPath . -Force
          foreach ($file in @('package.json', 'package-lock.json', 'scripts/build-android.ps1', 'android/app/src/main/AndroidManifest.xml')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required source: $file" }
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed' }

      - name: Install MYRAA JavaScript dependencies
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Build and sign Android APK
        shell: pwsh
        run: |
          & ./scripts/build-android.ps1 -SdkRoot $env:ANDROID_HOME -JavaRoot $env:JAVA_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Android build failed' }

      - name: Validate APK
        shell: pwsh
        run: |
          $apk = 'artifacts/android/MYRAA-Mobile-1.0.0-rc.5-private.apk'
          if (-not (Test-Path -LiteralPath $apk)) { throw 'No output APK found' }
          $tool = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0/apksigner.bat'
          & $tool verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature check failed' }
          Get-FileHash -LiteralPath $apk -Algorithm SHA256 | Format-List

      - name: Upload MYRAA Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-Android-APK
          path: artifacts/android/MYRAA-Mobile-1.0.0-rc.5-private.apk
          retention-days: 7
          if-no-files-found: error
